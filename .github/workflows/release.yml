name: Build SavolOffice DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal --target aarch64-apple-darwin
      - name: Build SavolOffice for Apple Silicon
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: packaging/macos/package.sh --arch aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: SavolOffice
          path: dist/release/SavolOffice.dmg
          if-no-files-found: error
