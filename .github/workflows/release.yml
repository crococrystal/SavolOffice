name: Build Savol Office DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch fallback font (pinned)
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: craft-fonts
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal --target aarch64-apple-darwin
      - name: Build Savol Office for Apple Silicon
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: packaging/macos/package.sh --arch aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: Savol Office
          path: dist/release/Savol Office.dmg
          if-no-files-found: error
